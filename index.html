<script>
const titles=[
"Introduction to ECG","Cardiac Anatomy and Electrical Conduction","ECG Waves, Segments and Intervals","Heart Rate and Rhythm Analysis","Normal Sinus Rhythm","Sinus Bradycardia and Sinus Tachycardia","Atrial Arrhythmias","Supraventricular Tachycardia and Junctional Rhythms","Ventricular Arrhythmias","Atrioventricular Blocks","Bundle Branch Blocks","12-Lead ECG Interpretation","Myocardial Ischemia and Infarction","Clinical ECG Case Studies","Final ECG Assessment"];
const durations=["20 min","25 min","30 min","25 min","20 min","25 min","35 min","35 min","40 min","40 min","35 min","45 min","45 min","50 min","40 min"];
const levels=["Beginner","Beginner","Beginner","Beginner","Beginner","Beginner","Intermediate","Intermediate","Intermediate","Intermediate","Intermediate","Advanced","Advanced","Advanced","Advanced"];
const lessons=[
{intro:"Understand what an ECG records, what it cannot tell you, and why clinical context matters.",sections:[["What an ECG measures","An electrocardiogram records voltage differences produced by cardiac depolarization and repolarization over time. It is an electrical recording; it does not directly measure mechanical contraction, cardiac output, or coronary blood flow."],["The standard recording","A standard 12-lead ECG uses 10 electrodes to produce 12 electrical views. At the usual paper speed of 25 mm/s, one small horizontal square is 40 ms and one large square is 200 ms. Standard calibration is 10 mm/mV."],["A safe first look","Confirm patient details and calibration, assess the patient, then read the tracing systematically. A normal-looking ECG does not rule out acute coronary syndrome when symptoms are concerning."]],key:"An ECG is a snapshot of cardiac electrical activity. Interpret it with symptoms, examination, previous tracings and relevant investigations."},
{intro:"Follow the electrical impulse from the sinus node through the atria, AV node and ventricular conduction network.",sections:[["Conduction sequence","The usual sequence is sinoatrial (SA) node → atrial myocardium → atrioventricular (AV) node → His bundle → right and left bundle branches → Purkinje network."],["Why the AV node matters","Slow conduction through the AV node allows time for ventricular filling. Delay or interruption in the conduction system can produce AV block or escape rhythms."],["Connect anatomy to the ECG","Atrial depolarization produces the P wave. Ventricular depolarization produces the QRS complex. The PR interval includes atrial and AV conduction time."]],key:"The ECG is the surface expression of electrical activation—not a direct picture of the conduction tissue."},
{intro:"Learn to measure the P wave, PR interval, QRS complex, ST segment, T wave and QT interval.",sections:[["P wave and PR interval","The P wave represents atrial depolarization. The PR interval runs from the start of the P wave to the start of the QRS; a typical adult reference range is 120–200 ms."],["QRS complex","The QRS represents ventricular depolarization. A QRS under 120 ms is generally considered narrow; a wider complex requires assessment for bundle branch block, ventricular origin, pacing or other causes."],["ST segment, T wave and QT","The ST segment is assessed relative to the baseline. The T wave represents ventricular repolarization. QT includes ventricular depolarization and repolarization; interpret QTc using a stated correction method and clinical context."]],key:"Measure intervals in milliseconds and check the calibration before interpreting them."},
{intro:"Calculate rate and decide whether a rhythm is regular, irregular or patterned.",sections:[["Regular rhythms","At 25 mm/s, estimate rate using 300 divided by the number of large squares between consecutive R waves. The 1500 method (1500 divided by small squares) is more precise when the rhythm is regular."],["Irregular rhythms","Count QRS complexes over a known 10-second strip and multiply by 6 for an approximate rate. State that this is an estimate."],["Rhythm questions","Is the rhythm regular? Are P waves present and consistent? Is each P followed by a QRS? Is the PR constant? Is the QRS narrow or wide?"]],key:"Rate first, then rhythm regularity, atrial activity, AV relationship and QRS width."},
{intro:"Recognize sinus rhythm by its rate, regularity, P-wave morphology and consistent AV conduction.",sections:[["Diagnostic pattern","In adults, normal sinus rhythm is usually 60–100 bpm, regular, with a consistent sinus P wave before every QRS and a PR interval of 120–200 ms."],["Do not overcall normal","A normal sinus rhythm does not exclude structural heart disease, ischemia or other pathology. Always interpret the tracing in context."],["Common checks","Confirm a consistent P-wave axis, one-to-one P-to-QRS relationship, stable PR interval and narrow QRS unless a known conduction abnormality is present."]],key:"Sinus rhythm is a rhythm diagnosis—not a declaration that the heart is healthy."},
{intro:"Distinguish slow and fast sinus rhythms and look for the underlying cause.",sections:[["Sinus bradycardia","Sinus rate below 60 bpm in adults, with sinus P waves before each QRS. It may be physiological (for example, during sleep or in trained athletes) or associated with medication, hypothyroidism or sinus node dysfunction."],["Sinus tachycardia","Sinus rate above 100 bpm in adults. Consider fever, pain, dehydration, anemia, hypovolemia, hypoxia, medication effects and other causes."],["Clinical priority","Assess symptoms, blood pressure and perfusion. Treat the cause. A rate threshold alone does not determine whether a patient is unstable."]],key:"A fast sinus rhythm is often a response to a physiological problem. Look for and treat the cause."},
{intro:"Identify atrial fibrillation, atrial flutter and premature atrial complexes.",sections:[["Atrial fibrillation","No consistent discrete P waves and an irregularly irregular ventricular rhythm are typical. Assess rate, symptoms, stroke risk, bleeding risk and associated disease clinically."],["Atrial flutter","A macro-reentrant atrial rhythm, often with regular flutter waves around 250–350/min. AV conduction may be 2:1, 3:1, 4:1 or variable; do not assume every narrow regular tachycardia is SVT."],["Premature atrial complexes","An early beat with a P wave of different morphology, often followed by a narrow QRS. The pause that follows is commonly non-compensatory."]],key:"Look for atrial activity and the pattern of R–R intervals. Flutter waves may be hidden in QRS or T waves."},
{intro:"Study regular narrow-complex tachycardia and rhythms arising near the AV junction.",sections:[["Regular narrow-complex SVT","AVNRT and AVRT commonly produce a regular narrow-complex tachycardia. P waves may be hidden in or appear immediately after the QRS. Rate alone cannot identify the mechanism."],["Junctional rhythms","Junctional impulses may produce absent, inverted or retrograde P waves. P waves can occur before, within or after the QRS. QRS complexes are often narrow unless there is pre-existing aberrancy."],["Clinical safety","Assess hemodynamic stability first. Management depends on the rhythm, patient condition and current resuscitation guidance; this course is not a treatment protocol."]],key:"A regular narrow tachycardia is a pattern, not a complete mechanism diagnosis."},
{intro:"Recognize PVCs, ventricular tachycardia, torsades de pointes and ventricular fibrillation.",sections:[["Premature ventricular complexes","A PVC is an early, usually broad and morphologically different QRS without a preceding sinus P wave. Assess frequency, morphology, symptoms and underlying disease."],["Ventricular tachycardia","A regular wide-complex tachycardia, especially in a patient with structural heart disease or prior infarction, should raise strong concern for VT. AV dissociation, capture beats and fusion beats support the diagnosis when present."],["Torsades and VF","Torsades de pointes is polymorphic VT associated with prolonged QT. VF is chaotic ventricular electrical activity without organized QRS complexes and is a cardiac-arrest rhythm."]],key:"A wide-complex tachycardia can be dangerous. In an uncertain case, do not casually label it benign SVT with aberrancy."},
{intro:"Compare first-, second- and third-degree AV block using the PR interval and P-to-QRS relationship.",sections:[["First-degree AV block","PR interval is greater than 200 ms, but every P wave conducts to a QRS. This is AV conduction delay rather than a dropped beat."],["Mobitz I (Wenckebach)","PR intervals progressively lengthen until a P wave is not followed by a QRS; the pattern then repeats."],["Mobitz II and complete block","Mobitz II has intermittent non-conducted P waves without progressive PR lengthening in conducted beats. Complete AV block has independent atrial and ventricular activity (AV dissociation). These findings need prompt clinical assessment."]],key:"Do not confuse a long PR with a dropped beat. Examine several consecutive cycles."},
{intro:"Identify right and left bundle branch block patterns and their clinical context.",sections:[["Right bundle branch block","Complete RBBB typically has QRS duration ≥120 ms, an rsR′/rSR′ pattern in V1–V2 and a broad terminal S wave in leads I and V6."],["Left bundle branch block","Complete LBBB typically has QRS duration ≥120 ms, broad or notched R waves in I, aVL, V5 and V6, and a predominantly negative QRS in V1."],["Clinical context","Bundle branch block may occur with structural or ischemic heart disease. LBBB changes the interpretation of ST segments; LBBB alone does not diagnose acute MI."]],key:"Use morphology across multiple leads and measure QRS duration. Avoid diagnosing from one lead alone."},
{intro:"Use a repeatable 12-lead sequence: calibration, rate, rhythm, axis, intervals, morphology and ST–T changes.",sections:[["Start with technical quality","Confirm patient details, paper speed (usually 25 mm/s), calibration (usually 10 mm/mV), lead placement and artifact."],["Rate, rhythm and axis","Calculate rate, assess regularity and P-to-QRS relationship. Use leads I and aVF for an initial axis screen; if I is positive and aVF negative, inspect lead II to distinguish borderline from left axis deviation."],["Intervals and morphology","Measure PR, QRS and QT/QTc. Assess Q waves, R-wave progression, voltage, bundle branch patterns and chamber enlargement criteria."],["ST–T and final statement","Assess ST elevation/depression and T-wave changes in contiguous leads, compare prior ECGs and correlate with symptoms. Write a structured conclusion rather than relying on an automated statement."]],key:"Document rate, rhythm, axis, intervals, QRS morphology, ST–T findings and comparison with prior ECG."},
{intro:"Understand ischemic patterns, infarct territories, reciprocal changes and the limits of ECG diagnosis.",sections:[["Ischemic patterns","ST depression and T-wave inversion can occur with ischemia but are not specific in isolation. Dynamic changes and the clinical presentation matter."],["Territories","Inferior: II, III, aVF. Septal: V1–V2. Anterior: V3–V4. Lateral: I, aVL, V5–V6. Posterior injury may be suggested by reciprocal ST depression in V1–V3 and assessed with posterior leads V7–V9."],["Acute coronary occlusion","ST elevation in anatomically related leads, hyperacute T waves and reciprocal changes can support acute coronary occlusion. A normal initial ECG does not exclude ACS; repeat ECGs and troponin testing may be required."]],key:"Never diagnose or exclude myocardial infarction from one isolated ECG feature. Clinical assessment is urgent when symptoms suggest ACS."},
{intro:"Apply a consistent approach to clinical scenarios. Read the tracing before revealing the answer.",sections:[["Case A — irregular tachycardia","A 72-year-old with palpitations has an irregularly irregular narrow-complex rhythm and no consistent P waves. Most likely pattern: atrial fibrillation. Consider rate, duration, symptoms and stroke-risk assessment."],["Case B — wide-complex tachycardia","A 65-year-old with prior MI has a regular wide-complex tachycardia at 180/min. Treat the pattern as VT until adequately assessed; assess stability immediately."],["Case C — chest pain","A 58-year-old with central chest pain has ST elevation in II, III and aVF with reciprocal depression in I/aVL. This is concerning for an acute inferior STEMI pattern and requires emergency ACS care."],["Case D — AV conduction","A tracing has PR 240 ms and every P wave is followed by a QRS. This is first-degree AV block."]],key:"State what you see first, then the likely diagnosis, then what must be checked clinically."},
{intro:"Test the essential principles from the full course and identify topics for further practice.",sections:[["Assessment approach","For each tracing, describe rate, rhythm, atrial activity, PR, QRS, axis when appropriate, ST–T changes and the most likely interpretation."],["Clinical reasoning","Separate observation from interpretation. For example: 'irregularly irregular rhythm with no consistent P waves' is an observation; 'atrial fibrillation' is the interpretation."],["Keep learning","Revisit missed topics and practice with multiple examples. Real-world ECG interpretation requires supervised clinical training and correlation with patient data."]],key:"Accuracy comes from a consistent method, repeated practice and clinical correlation."}
];
const quizzes=[
{q:"What does an ECG primarily record?",o:["Mechanical contraction","Electrical activity","Blood pressure","Oxygen saturation"],a:1,e:"An ECG records electrical potential differences generated by cardiac depolarization and repolarization."},
{q:"Where does normal cardiac activation usually begin?",o:["AV node","SA node","Bundle of His","Purkinje fibres"],a:1,e:"The sinoatrial node is the usual primary pacemaker."},
{q:"A typical adult PR interval is:",o:["40–80 ms","120–200 ms","220–300 ms","300–400 ms"],a:1,e:"A typical normal PR interval is 120–200 ms."},
{q:"At 25 mm/s, one large square represents:",o:["40 ms","100 ms","200 ms","1 second"],a:2,e:"One large square is 5 small squares, or 200 ms at 25 mm/s."},
{q:"Which pattern supports normal sinus rhythm?",o:["No P waves","One consistent P before each QRS","Irregularly irregular R-R","Independent P and QRS"],a:1,e:"Sinus rhythm has consistent sinus P waves preceding each QRS."},
{q:"Sinus tachycardia in an adult is generally a sinus rate:",o:["Below 40 bpm","Below 60 bpm","Above 100 bpm","Above 250 bpm"],a:2,e:"Sinus tachycardia is conventionally above 100 bpm in adults."},
{q:"Which finding is typical of atrial fibrillation?",o:["Regular R-R intervals","Irregularly irregular rhythm","Progressive PR lengthening","Sawtooth flutter waves"],a:1,e:"AF typically has no consistent P waves and an irregularly irregular ventricular response."},
{q:"Typical AVNRT often appears as:",o:["Regular narrow-complex tachycardia","Irregular wide-complex rhythm","Complete AV dissociation","Ventricular fibrillation"],a:0,e:"Typical AVNRT is commonly a regular narrow-complex tachycardia."},
{q:"A premature ventricular complex is usually:",o:["Early and wide","Early with a normal P wave","A flutter wave","A prolonged PR only"],a:0,e:"PVCs are premature, usually broad QRS complexes without a preceding related sinus P wave."},
{q:"Mobitz I is characterized by:",o:["Constant PR with dropped beats","Progressive PR lengthening then a dropped QRS","Complete AV dissociation","PR shorter than 100 ms"],a:1,e:"Wenckebach shows progressive PR prolongation before a non-conducted P wave."},
{q:"A classic RBBB pattern is seen in:",o:["V1 with rsR′","V6 with delta wave","II with sawtooth","aVR with epsilon wave"],a:0,e:"An rsR′/rSR′ pattern in V1–V2 is typical of RBBB."},
{q:"Which leads provide a quick initial frontal axis screen?",o:["V1 and V2","I and aVF","V5 and V6","II and V6"],a:1,e:"Leads I and aVF provide a quick initial assessment of the frontal QRS axis."},
{q:"The inferior leads are:",o:["V1–V4","I and aVL","II, III and aVF","V5 and V6"],a:2,e:"II, III and aVF view the inferior territory."},
{q:"A regular wide-complex tachycardia in a patient with prior MI should raise strong concern for:",o:["Sinus arrhythmia","Ventricular tachycardia","First-degree AV block","Normal rhythm"],a:1,e:"VT is a key concern in structural heart disease with regular wide-complex tachycardia."},
{q:"A PR interval of 240 ms with every P conducted is:",o:["Mobitz II","Complete heart block","First-degree AV block","Atrial fibrillation"],a:2,e:"First-degree AV block is PR >200 ms with 1:1 AV conduction."}
];
const cases=[
{title:"Case 01 · Irregular narrow tachycardia",desc:"72-year-old with palpitations. Ventricular rhythm is irregularly irregular; no consistent P waves are visible.",diagnosis:"Atrial fibrillation",why:"The absence of consistent discrete P waves and irregularly irregular R–R intervals are the key observations. Assess ventricular rate and the patient's clinical state."},
{title:"Case 02 · Regular wide tachycardia",desc:"65-year-old with previous myocardial infarction. Regular wide-complex tachycardia at approximately 180/min.",diagnosis:"Ventricular tachycardia must be presumed",why:"Prior MI increases the likelihood of scar-related VT. A wide-complex tachycardia requires urgent assessment; do not rely on rate alone."},
{title:"Case 03 · Inferior ST elevation",desc:"58-year-old with severe central chest pain. ST elevation in II, III and aVF with reciprocal depression in I and aVL.",diagnosis:"Acute inferior STEMI pattern",why:"The changes occur in contiguous inferior leads with reciprocal changes. This is an emergency pattern requiring immediate ACS pathway assessment."},
{title:"Case 04 · Long PR",desc:"Routine ECG. PR interval measures 240 ms; every P wave is followed by a narrow QRS.",diagnosis:"First-degree AV block",why:"PR is prolonged beyond 200 ms but AV conduction remains 1:1. There are no dropped QRS complexes."}
];
let completed=JSON.parse(localStorage.getItem("ecgCompleted")||"[]"), current=0, quizAnswers={};
function updateProgress(){let n=completed.length,p=Math.round(n/15*100);document.getElementById("pct").textContent=p+"%";document.getElementById("progressbar").style.width=p+"%";document.getElementById("donecount").textContent=n+" of 15 lessons"}
function ecgSVG(kind="sinus"){let path="",x=0;let base=95;for(let i=0;i<5;i++){let s=i*190;let p=kind==="af"?[0,0,0,0,0]:[0,0,0];let qrs=kind==="vt"?[s+8,base,s+24,base-58,s+38,base+25,s+60,base]:[s+8,base,s+19,base+7,s+28,base-48,s+39,base+2,s+48,base];let wave=kind==="af"?`M${s} ${base} q 12 -9 24 0 t 25 2 t 25 -3`:`M${s} ${base} q 12 -18 24 0`;path+=wave+" L"+qrs.join(" ");}return `<svg viewBox="0 0 960 150" role="img" aria-label="Illustrative ECG waveform"><defs><pattern id="sm" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#f2caca" stroke-width=".7"/></pattern><pattern id="lg" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#sm)"/><path d="M50 0H0V50" fill="none" stroke="#e5a6a6" stroke-width="1"/></pattern></defs><rect width="960" height="150" fill="#fffafa"/><rect width="960" height="150" fill="url(#lg)"/><path d="${path}" fill="none" stroke="#172b40" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function strip(kind,label,source){return `<div class="ecgcard">${ecgSVG(kind)}<div class="ecgmeta"><span>${label}</span><span>${source}</span></div></div>`}
function home(){return `<section class="hero"><div class="eyebrow">A practical ECG learning pathway</div><h1>Learn to read the heart.<br>One tracing at a time.</h1><p>Build a repeatable interpretation method, understand common rhythm patterns and practise clinical reasoning with structured cases.</p><div class="actions"><button class="primary" onclick="openLesson(0)">Start learning →</button><button class="secondary" onclick="showPage('cases')">Explore ECG cases</button></div></section><div class="stats"><div class="stat"><strong>15</strong><span>Structured lessons</span></div><div class="stat"><strong>4</strong><span>Clinical reasoning cases</span></div><div class="stat"><strong id="statdone">${completed.length}</strong><span>Lessons completed</span></div></div><div class="sectionhead"><h2>Continue your course</h2><span>Foundation to advanced</span></div><div class="lesson-grid">${titles.slice(0,4).map((t,i)=>lessonCard(i)).join("")}</div><div class="sectionhead"><h2>Learn with a method</h2><span>Use the same sequence every time</span></div><div class="card"><p class="muted">Calibration → Rate → Rhythm → Axis → Intervals → QRS morphology → ST–T changes → Clinical interpretation</p><button class="secondary" onclick="showPage('method')">Open interpretation guide</button></div>`}
function lessonCard(i){return `<button class="lesson" onclick="openLesson(${i})"><span class="num">${String(i+1).padStart(2,"0")}</span><span><strong>${titles[i]}</strong><small>${durations[i]} · ${levels[i]}</small></span><span class="done">${completed.includes(i)?"✓":"→"}</span></button>`}
function curriculum(){return `<div class="pagehead"><div><div class="eyebrow">Course curriculum</div><h1>All lessons</h1><p class="muted">15 lessons, from ECG fundamentals to clinical interpretation.</p></div></div><div class="lesson-grid">${titles.map((_,i)=>lessonCard(i)).join("")}</div>`}
function openLesson(i){current=i;document.getElementById("crumb").textContent="Your learning space / Lesson "+(i+1);document.getElementById("sidebar").classList.remove("open");let l=lessons[i];let kind=i===6?"af":i===8?"vt":"sinus";let extra=i===6?strip("af","Rhythm morphology illustration — not a clinical recording","Concept diagram"):i===8?strip("vt","Wide-complex rhythm illustration — not a clinical recording","Concept diagram"):strip("sinus","ECG waveform illustration — not a clinical recording","Concept diagram");let quiz=quizzes[i];document.getElementById("view").innerHTML=`<div class="pagehead"><div><div class="eyebrow">Lesson ${String(i+1).padStart(2,"0")} · ${levels[i]}</div><h1>${titles[i]}</h1><p class="muted">${durations[i]} · Practical learning objectives</p></div><span class="pill">${completed.includes(i)?"COMPLETED":"IN PROGRESS"}</span></div><article class="article"><p>${l.intro}</p>${extra}${l.sections.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join("")}<div class="callout"><strong>Key clinical takeaway</strong><br>${l.key}</div><div class="source">For further ECG examples, use the linked case libraries in <a href="https://litfl.com/ecg-library/" target="_blank" rel="noopener">LITFL ECG Library</a> and <a href="https://ecg.bidmc.harvard.edu/" target="_blank" rel="noopener">Harvard Wave-Maven</a>. The waveform above is a teaching illustration, not a patient ECG.</div></article><section class="quiz"><div class="eyebrow">Knowledge check</div><h2>${quiz.q}</h2>${quiz.o.map((o,j)=>`<button class="option" onclick="answer(${j},${quiz.a},this)">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}<div class="feedback" id="feedback">Choose the best answer to see the explanation.</div></section><div class="actions" style="margin-top:22px"><button class="primary" onclick="markComplete(${i})">${completed.includes(i)?"Completed ✓":"Mark lesson complete"}</button>${i<14?`<button class="secondary" onclick="openLesson(${i+1})">Next lesson →</button>`:""}</div>`;window.scrollTo(0,0)}
function answer(n,a,el){let opts=el.parentElement.querySelectorAll(".option");opts.forEach((b,i)=>{b.disabled=true;if(i===a)b.classList.add("correct")});if(n!==a)el.classList.add("wrong");document.getElementById("feedback").textContent=(n===a?"Correct. ":"Not quite. ")+quizzes[current].e}
function markComplete(i){if(!completed.includes(i)){completed.push(i);localStorage.setItem("ecgCompleted",JSON.stringify(completed))}updateProgress();openLesson(i)}
function casesPage(){return `<div class="pagehead"><div><div class="eyebrow">Clinical practice</div><h1>ECG case library</h1><p class="muted">Read the clinical description and commit to an interpretation before revealing the teaching point.</p></div></div><div class="casegrid">${cases.map((c,i)=>`<div class="case"><div class="eyebrow">${String(i+1).padStart(2,"0")} · CASE</div><h3>${c.title}</h3><p>${c.desc}</p>${strip(i===0?"af":i===1?"vt":"sinus","Schematic rhythm cue — not a clinical ECG","Illustrative only")}<button class="secondary reveal" onclick="document.getElementById('case${i}').classList.toggle('hidden')">Reveal interpretation</button><div id="case${i}" class="callout hidden"><strong>${c.diagnosis}</strong><br>${c.why}</div></div>`).join("")}</div><div class="callout warning" style="margin-top:20px">These are educational scenarios, not real patient records. Clinical decisions require assessment of the actual patient and a complete diagnostic context.</div>`}
function methodPage(){let steps=[["1. Calibration & quality","Check patient details, paper speed, gain, lead placement and artifact."],["2. Rate","Use 300 ÷ large squares for a regular rhythm; count over 10 seconds × 6 for an irregular strip."],["3. Rhythm","Assess regularity, P waves, P-to-QRS relationship and PR consistency."],["4. Axis","Use leads I and aVF as a first screen; inspect lead II when I is positive and aVF negative."],["5. Intervals","Measure PR, QRS and QT/QTc; state the units."],["6. QRS morphology","Look for bundle branch block, pathological Q waves, voltage and R-wave progression."],["7. ST–T changes","Assess contiguous leads, reciprocal changes and compare with previous ECGs."],["8. Clinical conclusion","Summarize findings and correlate with symptoms, examination and investigations."]];return `<div class="eyebrow">Reference guide</div><h1>Systematic 12-lead interpretation</h1><p class="muted">A repeatable checklist reduces omissions. It does not replace clinical judgment.</p>${steps.map(s=>`<div class="card" style="margin:12px 0"><h3 style="margin:0 0 5px;color:var(--teal)">${s[0]}</h3><p style="margin:0;color:#c4d1e2">${s[1]}</p></div>`).join("")}<div class="callout warning">If the patient is unstable or the tracing suggests a life-threatening rhythm or acute coronary occlusion, prioritize urgent clinical care. Do not delay treatment to complete a checklist.</div>`}
function sourcesPage(){return `<div class="eyebrow">Evidence & further study</div><h1>Sources and ECG libraries</h1><p class="muted">Use these specialist resources to study real clinical tracings. Each source has its own reuse terms.</p><div class="card"><h3>LITFL ECG Library</h3><p>Free ECG educational library with a wide range of rhythm and pathology examples. LITFL permits educational reproduction subject to its stated conditions: non-profit teaching use, attribution to litfl.com, and no third-party image ownership label.</p><a href="https://litfl.com/ecg-library/" target="_blank" rel="noopener">Open LITFL ECG Library ↗</a></div><div class="card" style="margin-top:12px"><h3>Harvard / BIDMC Wave-Maven</h3><p>ECG cases with quiz and reference modes. Use the site to practise interpretation; do not assume its images can be republished without permission.</p><a href="https://ecg.bidmc.harvard.edu/" target="_blank" rel="noopener">Open Wave-Maven ↗</a></div><div class="card" style="margin-top:12px"><h3>PhysioNet — MIT-BIH Arrhythmia Database</h3><p>Real digitized ambulatory ECG recordings with beat annotations. The database is available under the Open Data Commons Attribution License (ODC-By 1.0); public use of produced work must include a notice identifying the source and license. Individual content may have separate rights.</p><a href="https://physionet.org/content/mitdb/1.0.0/" target="_blank" rel="noopener">Open MIT-BIH database ↗</a> · <a href="https://physionet.org/content/mitdb/view-license/1.0.0/" target="_blank" rel="noopener">License ↗</a></div><div class="callout">Current build note: the waveform panels in this version are clearly marked teaching illustrations. The external libraries above provide real clinical examples. The next data integration step is to import selected PhysioNet segments with record-level labels and source attribution.</div>`}
function showPage(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("crumb").textContent="Your learning space / "+({home:"Dashboard",curriculum:"All lessons",cases:"ECG case library",method:"Interpretation method",sources:"Sources & references"}[p]||"Dashboard");document.getElementById("sidebar").classList.remove("open");document.getElementById("view").innerHTML=({home,curriculum,cases:casesPage,method:methodPage,sources:sourcesPage}[p]||home)();window.scrollTo(0,0)}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));document.getElementById("menu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));updateProgress();showPage("home");
</script>
</body></html>
